<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💕 Fara Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; }
        body { background: #FFF5F9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .login-container { width: 100%; max-width: 400px; }
        .login-card { background: white; border-radius: 24px; padding: 40px 28px; box-shadow: 0 8px 32px rgba(219, 39, 119, 0.10); border: 1px solid #F9A8D4; }
        .logo-text { font-size: 28px; font-weight: 800; text-align: center; }
        .logo-text span:first-child { color: #DB2777; }
        .logo-text span:last-child { color: #1a2236; }
        .subtitle { text-align: center; color: #6a7fa8; font-size: 14px; margin-top: 2px; }
        .input-field { width: 100%; padding: 14px 16px; border: 2px solid #F9A8D4; border-radius: 14px; font-size: 15px; transition: border 0.2s; background: #FFF0F8; }
        .input-field:focus { outline: none; border-color: #DB2777; background: white; }
        .btn-primary { width: 100%; padding: 14px; background: #DB2777; color: white; border: none; border-radius: 14px; font-weight: 700; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        .btn-primary:hover { background: #BE185D; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-message { color: #dc2626; font-size: 13px; text-align: center; min-height: 20px; }
        .input-group { position: relative; margin-bottom: 16px; }
        .input-group label { display: block; font-size: 13px; font-weight: 700; color: #DB2777; margin-bottom: 6px; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #F9A8D4; font-weight: 600; }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s ease infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .login-note { text-align: center; font-size: 12px; color: #999; margin-top: 8px; }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <div class="logo-text">
            <span>💕 Fara</span>
            <p class="subtitle">Hanya untuk kita berdua</p>
        </div>

        <div id="loginForm">
            <div class="input-group">
                <label>Nama Kamu</label>
                <input type="text" id="loginName" class="input-field" placeholder="Fajar atau Rani" />
            </div>
            <div class="input-group">
                <label>Kode Pasangan</label>
                <input type="password" id="loginCode" class="input-field" placeholder="Masukkan kode rahasia" />
            </div>
            <div class="error-message" id="loginError"></div>
            <button class="btn-primary" id="loginBtn">Masuk 💕</button>
            <p class="login-note">💡 Tanya pasangan untuk kode rahasia</p>
        </div>

        <div class="footer">Made with ❤️ untuk Fajar & Rani</div>
    </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
// ==========================================
// --- FIREBASE CONFIG ---
// ==========================================
const firebaseConfig = {
    apiKey: 'AIzaSyBvsdvBHxViIxObWEY7ssUXdPHEuLz3b-o',
    authDomain: 'fara-2e838.firebaseapp.com',
    databaseURL: 'https://fara-2e838-default-rtdb.asia-southeast1.firebasedatabase.app',
    projectId: 'fara-2e838',
    storageBucket: 'fara-2e838.firebasestorage.app',
    messagingSenderId: '312061013821',
    appId: '1:312061013821:web:fdf6d8c9559757ee181f54'
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ==========================================
// --- KONFIGURASI ---
// ==========================================
const COUPLE_CODE = 'LOVE_FAJAR_RANI';
const VALID_USERS = ['fajar', 'rani'];

// ==========================================
// --- DOM ---
// ==========================================
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const loginName = document.getElementById('loginName');
const loginCode = document.getElementById('loginCode');

// ==========================================
// --- LOGIN ---
// ==========================================
loginBtn.addEventListener('click', async function() {
    const name = loginName.value.trim().toLowerCase();
    const code = loginCode.value.trim().toUpperCase();

    // Validasi
    if (!name || !code) {
        loginError.textContent = 'Isi nama dan kode pasangan!';
        return;
    }

    if (!VALID_USERS.includes(name)) {
        loginError.textContent = 'Nama harus Fajar atau Rani!';
        return;
    }

    if (code !== COUPLE_CODE) {
        loginError.textContent = 'Kode salah, coba lagi 💔';
        return;
    }

    // Loading
    this.disabled = true;
    this.innerHTML = '<span class="loading-spinner"></span> Memproses...';
    loginError.textContent = '';

    try {
        // 🔧 PERBAIKAN: Cek dokumen dengan cara yang benar
        const userRef = db.collection('users').doc(name);
        const snap = await userRef.get();

        // 🔧 PERBAIKAN: Cek .exists (tanpa kurung)
        if (!snap.exists) {
            // Buat user baru
            await userRef.set({
                id: name,
                name: name === 'fajar' ? 'Fajar' : 'Rani',
                isOnline: true,
                lastSeen: new Date().toISOString(),
                fcmToken: ''
            });
            console.log('✅ User baru dibuat:', name);
        } else {
            // Update status online
            await userRef.update({
                isOnline: true,
                lastSeen: new Date().toISOString()
            });
            console.log('✅ User updated:', name);
        }

        // Simpan ke localStorage
        localStorage.setItem('fara_userId', name);
        localStorage.setItem('fara_name', name === 'fajar' ? 'Fajar' : 'Rani');

        // Redirect ke chat
        window.location.href = 'chat.html';

    } catch (error) {
        console.error('Login error:', error);
        loginError.textContent = 'Error: ' + error.message;
        this.disabled = false;
        this.textContent = 'Masuk 💕';
    }
});

// ==========================================
// --- ENTER KEY ---
// ==========================================
document.querySelectorAll('#loginName, #loginCode').forEach(input => {
    input.addEventListener('keypress', e => {
        if (e.key === 'Enter') loginBtn.click();
    });
});

// ==========================================
// --- CHECK SESSION ---
// ==========================================
const userId = localStorage.getItem('fara_userId');
if (userId && window.location.pathname.includes('index.html')) {
    window.location.href = 'chat.html';
}

console.log('🔐 Login page siap!');
</script>

</body>
</html>
